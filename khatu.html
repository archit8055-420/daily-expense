<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Expense & Money Transaction</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="khatu.css">


</head>
<body>

<div class="app-frame">

  <!-- HOME SCREEN -->
  <div id="homeScreen" class="screen active">
    <div class="deco calc">🧮</div>
    <div class="deco wallet-top">💳</div>
    <div class="deco shiva">🔱</div>
    <div class="deco om">🕉️</div>
    <div class="deco feather">🦚</div>
    <div class="deco krishna">🪈</div>

    <div class="home-panel">
      <div class="btn-with-icon">
        <span class="side-icon">💼</span>
        <button class="nav-btn" onclick="showScreen('expense')">Daily Expense</button>
      </div>
      <div class="btn-with-icon">
        <button class="nav-btn" onclick="showScreen('transaction')">Money Transaction</button>
        <span class="side-icon">💸</span>
      </div>
    </div>
  </div>

  <!-- DAILY EXPENSE SCREEN -->
  <div id="expenseScreen" class="screen app-bg">
    <button class="back-btn" onclick="showScreen('home')">← Home</button>
    <div class="title-cloud-wrap"><div class="title-cloud">Daily Expense</div></div>

    <div class="panel">
      <div class="top-row">
        <div class="pill">Select Month &amp; Year</div>
        <div class="select-pill">
          <select id="expMonth" onchange="renderExpenses()"></select>
        </div>
        <div class="select-pill">
          <select id="expYear" onchange="renderExpenses()"></select>
        </div>
      </div>

      <div class="section-label-wrap"><span class="section-label">Add Expense</span></div>

      <form class="input-row" id="expForm" onsubmit="event.preventDefault(); addOrUpdateExpense();">
        <input type="text" id="expName" class="teal-pill" placeholder="Expense Name" required>
        <input type="number" id="expAmount" class="teal-pill" placeholder="Enter Amount" required min="0.01" step="any">
        <div class="teal-pill date-pill" onclick="openDatePicker('expDate')">
          <span id="expDateText">07-Sep-2026</span>
          <span style="font-size: 18px;">📅</span>
          <input type="date" id="expDate" required onchange="updateDateDisplay('expDate','expDateText')">
        </div>
        <button type="submit" class="done-btn" id="expDoneBtn">Done</button>
      </form>

      <div class="table-wrap" id="expenseTableWrap"></div>

      <div class="bottom-row">
        <div class="total-box">Total Expense : ₹<span id="expTotal">0.00</span></div>
        <button class="pdf-btn" onclick="downloadExpensePDF()">Download PDF</button>
      </div>
    </div>
  </div>

  <!-- MONEY TRANSACTION SCREEN -->
  <div id="transactionScreen" class="screen app-bg">
    <button class="back-btn" onclick="showScreen('home')">← Home</button>
    <div class="title-cloud-wrap"><div class="title-cloud">Money Transaction</div></div>

    <div class="panel">
      <div class="top-row">
        <div class="pill">Select Month &amp; Year</div>
        <div class="select-pill">
          <select id="txnMonth" onchange="renderTransactions()"></select>
        </div>
        <div class="select-pill">
          <select id="txnYear" onchange="renderTransactions()"></select>
        </div>
      </div>

      <div class="section-label-wrap"><span class="section-label">Add Record</span></div>

      <form class="input-row" id="txnForm" onsubmit="event.preventDefault(); addOrUpdateTransaction();">
        <input type="text" id="txnFrom" class="teal-pill" placeholder="Payer" required>
        <input type="text" id="txnTo" class="teal-pill" placeholder="Receiver" required>
        <input type="number" id="txnAmount" class="teal-pill" placeholder="Enter Amount" required min="0.01" step="any">
        <div class="teal-pill date-pill" onclick="openDatePicker('txnDate')">
          <span id="txnDateText">07-Sep-2026</span>
          <span style="font-size: 18px;">📅</span>
          <input type="date" id="txnDate" required onchange="updateDateDisplay('txnDate','txnDateText')">
        </div>
        <button type="submit" class="done-btn" id="txnDoneBtn">Done</button>
      </form>

      <div class="table-wrap" id="transactionTableWrap"></div>

      <div class="bottom-row">
        <div class="total-box">Total : ₹<span id="txnTotal">0.00</span></div>
        <button class="pdf-btn" onclick="downloadTransactionPDF()">Download PDF</button>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="khatu.js"></script>
</body>
</html>
